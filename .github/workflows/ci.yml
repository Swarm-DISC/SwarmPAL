name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, staging]
  schedule:
    # Weekly on Sunday
    - cron: "0 1 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        runs-on: [ubuntu-latest, macos-latest, windows-latest]

    steps:

    # Remote tests need the VirES token, which is only available to runs in the
    # base repo. It is empty for PRs from forks and for Dependabot PRs, so detect
    # that here and skip the token-dependent steps below.
    - name: Skip remote tests when VirES token is unavailable
      env:
        VIRES_TOKEN: ${{ secrets.VIRES_TOKEN }}
      shell: bash
      run: |
        if [ -z "$VIRES_TOKEN" ]; then
          echo "SKIP_REMOTE_MARK=1" >> "$GITHUB_ENV"
        fi

    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0

    - name: Sync test dependencies with lock file
      run: |
        uv sync --frozen --group test --group apexpy_wheels --extra experimental

    - name: Configure token access
      if: env.SKIP_REMOTE_MARK != '1'
      env:
        VIRES_TOKEN: ${{ secrets.VIRES_TOKEN }}
      shell: bash
      run: |
        uv run viresclient set_token "https://vires.services/ows" "$VIRES_TOKEN"
        uv run viresclient set_default_server https://vires.services/ows

    - name: Test package (Exclude remote)
      run: uv run python -m pytest -ra -m "not remote"

    - name: Test package (Remote tests only)
      if: env.SKIP_REMOTE_MARK != '1'
      run: uv run python -m pytest -ra -m "remote"
