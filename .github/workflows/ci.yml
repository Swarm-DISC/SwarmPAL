name: CI

on:
  workflow_dispatch:
  pull_request:
    branches: [ main, staging]
  schedule:
    # Weekly on Sunday
    - cron: "0 1 * * 0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Check Python ${{ matrix.python-version }} on ${{ matrix.runs-on }}
    runs-on: ${{ matrix.runs-on }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]
        runs-on: [ubuntu-latest, macos-latest, windows-latest]

    steps:

    # When PRs come from a fork, skip tests requiring VirES token access (marked "remote")
    - name: Set SKIP_REMOTE_MARK if PR is from fork
      id: skip-remote
      run: |
        if [ "${{ github.event_name }}" = "pull_request" ] && \
           [ "${{ github.event.pull_request.head.repo.full_name }}" != "${{ github.repository }}" ]; then
          echo "SKIP_REMOTE_MARK=1" >> $GITHUB_ENV
        fi
      shell: bash

    - uses: actions/checkout@v6

    - uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install uv
      uses: astral-sh/setup-uv@v8.1.0

    - name: Sync test dependencies with lock file
      run: |
        uv sync --frozen --group test --group apexpy_wheels --extra experimental

    - name: Configure token access
      if: env.SKIP_REMOTE_MARK != '1'
      run: |
        uv run viresclient set_token "https://vires.services/ows" ${{ secrets.VIRES_TOKEN }}
        uv run viresclient set_default_server https://vires.services/ows

    - name: Test package (Exclude remote)
      run: uv run python -m pytest -ra -m "not remote"

    - name: Test package (Remote tests only)
      if: env.SKIP_REMOTE_MARK != '1'
      run: uv run python -m pytest -ra -m "remote"
